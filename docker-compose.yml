# Bonus: starts PostgreSQL and the full app (API + built client) together.
# Usage: docker compose up --build
# Then open http://localhost:4000  (demo user: demo@sweety.app / demo1234)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety_dev_pw
      POSTGRES_DB: sweety
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety -d sweety"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://sweety:sweety_dev_pw@db:5432/sweety
      JWT_SECRET: ${JWT_SECRET:-please-change-me-in-production}
    ports:
      - "4000:4000"
    command: sh -c "node src/migrate.js && node src/seed.js && node src/index.js"

volumes:
  db_data:
